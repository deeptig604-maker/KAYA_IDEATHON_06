<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Avshesh — Log in</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/enhance.css" />
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="index.html" class="brand"><span class="seed">🌾</span> <span data-i18n="brandName">Avshesh</span></a>
    <div class="nav-actions">
      <div class="lang-switch">
        <button data-lang="en">EN</button>
        <button data-lang="hi">हिं</button>
      </div>
    </div>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card page-enter">
    <h1 style="font-size:1.6rem; margin-bottom:2px;" data-i18n="authWelcome">Welcome to Avshesh</h1>
    <p style="margin-bottom:22px;" data-i18n="authSub">One account, for listing residue or finding it.</p>

    <div class="auth-tabs">
      <button type="button" class="active" id="tab-login" data-i18n="tabLogin">Log in</button>
      <button type="button" id="tab-signup" data-i18n="tabSignup">Create account</button>
    </div>

    <p id="login-notice" class="hint" style="display:none; margin-bottom:14px; color:var(--gold); font-weight:600;"></p>

    <!-- LOGIN FORM -->
    <form class="auth-form" id="login-form">
      <div class="role-toggle">
        <label><input type="radio" name="login-role" value="farmer" checked /><span data-i18n="iAmFarmer">Farmer</span></label>
        <label><input type="radio" name="login-role" value="buyer" /><span data-i18n="iAmBuyer">Buyer / Business</span></label>
      </div>
      <div class="field">
        <label data-i18n="labelPhone">Phone number</label>
        <input type="tel" id="login-phone" required data-i18n-ph="labelPhone" placeholder="Phone number" />
      </div>
      <div class="field">
        <label data-i18n="labelPassword">Password</label>
        <input type="password" id="login-password" required data-i18n-ph="labelPassword" placeholder="Password" />
      </div>
      <p class="auth-error" id="login-error" data-i18n="authErrorFind">No account found with these details. Try creating one.</p>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="btnLogin">Log in</button>
    </form>

    <!-- SIGNUP FORM -->
    <form class="auth-form" id="signup-form" style="display:none;">
      <div class="role-toggle">
        <label><input type="radio" name="signup-role" value="farmer" checked /><span data-i18n="iAmFarmer">Farmer</span></label>
        <label><input type="radio" name="signup-role" value="buyer" /><span data-i18n="iAmBuyer">Buyer / Business</span></label>
      </div>
      <div class="field">
        <label data-i18n="labelName">Full name</label>
        <input type="text" id="signup-name" required data-i18n-ph="labelName" placeholder="Full name" />
      </div>
      <div class="field" id="signup-business-field" style="display:none;">
        <label data-i18n="labelBusiness">Business / Company name</label>
        <input type="text" id="signup-business" data-i18n-ph="labelBusiness" placeholder="Business / Company name" />
      </div>
      <div class="field">
        <label data-i18n="labelPhone">Phone number</label>
        <input type="tel" id="signup-phone" required data-i18n-ph="labelPhone" placeholder="Phone number" />
      </div>
      <div class="field">
        <label data-i18n="labelLocation">Location</label>
        <input type="text" id="signup-location" required value="Mathura, Uttar Pradesh" />
      </div>
      <div class="field">
        <label data-i18n="labelPassword">Password</label>
        <input type="password" id="signup-password" required data-i18n-ph="labelPassword" placeholder="Password" />
      </div>
      <p class="auth-error" id="signup-error" data-i18n="authErrorFill">Please fill all required fields.</p>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="btnSignup">Create account</button>
    </form>

    <p class="auth-switch" id="switch-to-signup">
      <span data-i18n="authNoAccount">New to Avshesh?</span>
      <a data-i18n="authSwitchSignup">Create one</a>
    </p>
    <p class="auth-switch" id="switch-to-login" style="display:none;">
      <span data-i18n="authHaveAccount">Already have an account?</span>
      <a data-i18n="authSwitchLogin">Log in</a>
    </p>
  </div>
</div>

<div id="toast-stack"></div>

<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/chatbot.js"></script>
<script src="js/onboarding.js"></script>
<script src="js/login.js"></script>
</body>
</html>
